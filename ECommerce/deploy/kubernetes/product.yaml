apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-product-service
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecommerce-product-service
  template:
    metadata:
      labels:
        app: ecommerce-product-service
    spec:
      containers:
        - name: product-api
          image: ghcr.io/vaibhavjainibm/ecommerce-product-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__ProductConnection
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: product-connection
            - name: Jwt__Issuer
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: jwt-issuer
            - name: Jwt__Audience
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: jwt-audience
            - name: Jwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: ecommerce-secrets
                  key: jwt-signing-key
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-product-service
  namespace: ecommerce
spec:
  selector:
    app: ecommerce-product-service
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
